<!DOCTYPE html>
<html>
<head>
    <title>Qwen-VL 测试</title>
</head>
<body>
    <input type="file" id="imageInput" accept="image/*">
    <input type="text" id="context" placeholder="上下文（可选）">
    <input type="text" id="requirements" placeholder="需求（可选）">
    <button onclick="startGeneration()">生成标题和描述</button>
    <pre id="output" style="white-space: pre-wrap;"></pre>

    <script>
        function startGeneration() {
            const image = document.getElementById('imageInput').files[0];
            const context = document.getElementById('context').value;
            const requirements = document.getElementById('requirements').value;

            if (!image) {
                alert("请选择图片");
                return;
            }

            const formData = new FormData();
            formData.append('image', image);
            formData.append('context', context);
            formData.append('requirements', requirements);

            const output = document.getElementById('output');
            output.textContent = '';

            fetch('/generate', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                return reader.read().then(function process({ done, value }) {
                    if (done) return;

                    const chunk = decoder.decode(value, { stream: true });
                    // 简单解析 SSE 格式（data: ...\n\n）
                    const lines = chunk.split('\n\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const content = line.substring(6);
                            if (content === '[DONE]') break;
                            output.textContent += content + '\n';
                        }
                    }

                    return reader.read().then(process);
                });
            })
            .catch(err => {
                output.textContent += '\n❌ 错误: ' + err.message;
            });
        }
    </script>
</body>
</html>
