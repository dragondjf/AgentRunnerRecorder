name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win64
            artifact: AgentRunnerRecorder-Setup.exe
          - os: macos-latest
            platform: mac
            artifact: AgentRunnerRecorder-mac.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm recorder.spec

      - name: Rename Windows artifact
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mv dist/AgentRunnerRecorder.exe dist/AgentRunnerRecorder-Setup.exe

      - name: Package macOS artifact
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd dist
          zip -r -9 ../AgentRunnerRecorder-mac.zip AgentRunnerRecorder.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.artifact }}

      # ── 发布到 GitHub Releases（仅 tag 触发）──
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.artifact }}
          draft: true
