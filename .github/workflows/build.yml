name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win64
            artifact: AgentRunnerRecorder-Setup.exe
          - os: macos-latest
            platform: mac-arm64
            artifact: AgentRunnerRecorder-mac-arm64.zip
          - os: ubuntu-latest
            platform: linux-x64
            artifact: AgentRunnerRecorder-linux-x64.zip
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            artifact: AgentRunnerRecorder-linux-arm64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (verbose)
        run: |
          pyinstaller --noconfirm recorder.spec
          echo "Build completed. Contents of dist/:"
          ls -la dist/ || echo "dist/ directory not found!"

      - name: Install Linux GUI libraries
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 xvfb

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm recorder.spec

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mv dist/AgentRunnerRecorder.exe dist/AgentRunnerRecorder-Setup.exe

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd dist && zip -r -9 ../AgentRunnerRecorder-mac-arm64.zip AgentRunnerRecorder

      - name: Package Linux x64
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd dist && zip -r -9 ../AgentRunnerRecorder-linux-x64.zip AgentRunnerRecorder

      - name: Package Linux arm64
        if: matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          cd dist && zip -r -9 ../AgentRunnerRecorder-linux-arm64.zip AgentRunnerRecorder

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout for release notes
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          for f in \
            artifacts/win64/AgentRunnerRecorder-Setup.exe \
            artifacts/mac-arm64/AgentRunnerRecorder-mac-arm64.zip \
            artifacts/linux-x64/AgentRunnerRecorder-linux-x64.zip \
            artifacts/linux-arm64/AgentRunnerRecorder-linux-arm64.zip; do
            if [ -f "$f" ]; then
              cp "$f" release-assets/
              echo "Included: $f"
            else
              echo "Skipped (not found): $f"
            fi
          done
          echo "Assets to upload:"
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release-assets/*
