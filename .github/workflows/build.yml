name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win64
            artifact: AgentRunnerRecorder-win64.zip
          - os: macos-latest
            platform: mac-arm64
            artifact: AgentRunnerRecorder-mac-arm64.zip
          - os: ubuntu-latest
            platform: linux-x64
            artifact: AgentRunnerRecorder-linux-x64.zip
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            artifact: AgentRunnerRecorder-linux-arm64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller cython setuptools

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: pip install -r requirements-windows.txt

      - name: Install Linux GUI dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libxkbcommon-x11-0 \
            libxcb-xinerama0 libxcb-cursor0 xvfb

      # === 构建: make dist (build_ext + 复制文件到 dist/ + build_release.py) ===
      - name: Cython compile (build_ext)
        run: python release.py build_ext

      - name: Prepare dist/ (copy compiled modules + static files)
        shell: bash
        run: |
          DIST="dist"
          rm -rf "${DIST}"
          mkdir -p "${DIST}"
          cp -rf build/lib.*-3*/* "${DIST}/"
          cp -rf urecorder/static "${DIST}/urecorder"
          cp urecorder/application.json "${DIST}/urecorder"
          if [ -f urecorder/.env ]; then cp urecorder/.env "${DIST}/urecorder"; fi
          cp -rf images "${DIST}/images"
          cp recorder_app.py "${DIST}/recorder_app.py"

      - name: build_release.py (venv + Aliyun pip + PyInstaller + zip)
        shell: bash
        env:
          PREBUILT: '1'
          PYTHONIOENCODING: 'utf-8'
          PYTHONUTF8: '1'
          LC_ALL: 'C.UTF-8'
          LANG: 'C.UTF-8'
        run: python build_release.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          for f in artifacts/*/*.zip; do
            if [ -f "$f" ]; then
              cp "$f" release-assets/
              echo "Included: $f"
            fi
          done
          echo "Assets:"
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release-assets/*
